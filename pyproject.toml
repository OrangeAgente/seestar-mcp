[project]
name = "seestar-mcp"
version = "0.1.0"
description = "Auditable MCP server + Claude Code Skills to control a ZWO Seestar S50 and QA its output"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OrangeAgente", email = "12974973+OrangeAgente@users.noreply.github.com" }]
keywords = [
  "astronomy",
  "astrophotography",
  "telescope",
  "seestar",
  "mcp",
  "fits",
  "claude",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "mcp[cli]==1.28.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "numpy==2.2.6",
  "astropy==7.2.1",
  "photutils==2.3.0",
  "smbprotocol==1.16.1",
]

[project.optional-dependencies]
# seestar_refine's stacking/preview path only. The MCP server (device control +
# two-tier QA) does not import these, and every use site degrades honestly
# without them: check_backends reports pystack=false and the tools return
# error-tagged results rather than raising. Installing them pulls scikit-image,
# which is why they are not core.
refine = [
  "pillow==12.3.0",
  "astroalign==2.6.2",
  "astroscrappy==1.3.0",
]

[project.urls]
Homepage = "https://github.com/OrangeAgente/seestar-mcp"
Repository = "https://github.com/OrangeAgente/seestar-mcp"
Issues = "https://github.com/OrangeAgente/seestar-mcp/issues"

[dependency-groups]
dev = [
  # The suite covers seestar_refine, so the dev env needs the refine extra.
  "seestar-mcp[refine]",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "respx==0.22.0",
  "ruff==0.13.3",
  "cyclonedx-bom==7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seestar_mcp", "src/seestar_refine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
